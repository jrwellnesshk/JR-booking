# JR 醫館預約系統 - Docker 部署（Amazon RDS PostgreSQL 版）
# 架構（方案 A）：用戶 → EC2:443(HTTPS, Caddy 自動 Let's Encrypt) → app:4000
#   - SSL 由 Caddy 喺 EC2 本地做，DNS 留喺 Squarespace（A @ → EC2 EIP，CNAME www → 域名）
#   - EC2 SG 需開 80(http-01 challenge) + 443(HTTPS)；email 記錄留喺 Squarespace 唔使動
#   1. cp .env.example .env   並填好 SESSION_SECRET、DATABASE_URL（postgres://...）
#   2. docker compose up -d --build
#   3. docker compose logs app   睇初始 admin 密碼
# 切換 DB：.env 設 DATABASE_URL=postgres:// 開頭即自動轉 RDS（見 .env.example 註解）

services:
  app:
    build: .
    container_name: aurora-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/database.db   # 容器內 SQLite 路徑（配合 ./data volume）；host 跑 dev 時唔設呢個，用預設 ./database.db
    volumes:
      - ./data:/app/data                 # 生產資料持久化（目錄 volume，避免單一檔 bind mount 喺新 DB 時 CANTOPEN）
      - ./logs:/app/logs
    expose:
      - "4000"            # 只對內部網絡開放，由 caddy 反向代理

  caddy:
    image: caddy:2-alpine
    container_name: aurora-caddy
    restart: unless-stopped
    # 開 80 + 443：443 = HTTPS（Caddy 自動 Let's Encrypt），80 = ACME http-01 challenge + 自動 redirect
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
