# 寶天醫館預約系統 - Docker 部署（Amazon RDS PostgreSQL 版）
# 架構：CloudFront(SSL/ACM) → EC2:80(純 HTTP) → Caddy → app:4000
#   1. cp .env.example .env   並填好 SESSION_SECRET、DATABASE_URL（postgres://...）
#   2. docker compose up -d --build
#   3. docker compose logs app   睇初始 admin 密碼
# 切換 DB：.env 設 DATABASE_URL=postgres:// 開頭即自動轉 RDS（見 .env.example 註解）

services:
  app:
    build: .
    container_name: aurora-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/database.db   # 容器內 SQLite 路徑（配合 ./data volume）；host 跑 dev 時唔設呢個，用預設 ./database.db
    volumes:
      - ./data:/app/data                 # 生產資料持久化（目錄 volume，避免單一檔 bind mount 喺新 DB 時 CANTOPEN）
      - ./logs:/app/logs
    expose:
      - "4000"            # 只對內部網絡開放，由 caddy 反向代理

  caddy:
    image: caddy:2-alpine
    container_name: aurora-caddy
    restart: unless-stopped
    # 只開 80：SSL 由 CloudFront 做，EC2 收純 HTTP（符合 SG 80←CloudFront prefix list）
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
