name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all source files
        run: |
          find . -maxdepth 2 -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Smoke test (boot server + health endpoint)
        run: |
          cp .env.example .env
          printf 'CAPTCHA_TEST_BYPASS=test999\nSESSION_SECRET=ci-test-secret-change-me\nNODE_ENV=test\n' >> .env
          node server.js > /tmp/srv.log 2>&1 &
          SRV=$!
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4000/api/beds/labels >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:4000/api/beds/labels || { cat /tmp/srv.log; kill $SRV; exit 1; }
          kill $SRV || true
